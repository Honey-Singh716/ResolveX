# ============================================================
# railway.toml — ResolveX Frontend Service
# Place this file in the /frontend directory
# ============================================================

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[build.args]
# Set VITE_API_BASE_URL as a Railway Variable (Settings → Variables) to your real backend URL.
# e.g. https://resolvex-backend.up.railway.app/api/v1
# The value here is a fallback placeholder only.
VITE_API_BASE_URL = "https://your-backend.up.railway.app/api/v1"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
